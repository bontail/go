name: encoding/hex SIMD benchmarks

on:
  push:
    branches:
      - codex/hex-simd-review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - target: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - target: wasm
            runner: ubuntu-24.04
            goos: js
            goarch: wasm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260615155930-9e4b9ddef5b6

      - name: Build Go toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          cd src
          ./make.bash --no-banner

      - name: Run benchmarks and benchstat
        shell: bash
        run: |
          set -euxo pipefail
          raw_dir="${RUNNER_TEMP}/hex-simd-benchmarks"
          rm -rf "$raw_dir"
          mkdir -p "$raw_dir"
          mkdir -p benchmark-results
          for experiment in simd nosimd; do
            output="$raw_dir/${experiment}.txt"
            if [[ "${{ matrix.target }}" == wasm ]]; then
              env \
                GO111MODULE=off \
                GOEXPERIMENT="$experiment" \
                GOOS="${{ matrix.goos }}" \
                GOARCH="${{ matrix.goarch }}" \
                ./bin/go test \
                  -run='^$' \
                  -bench='^(BenchmarkEncode|BenchmarkDecode)$' \
                  -benchtime=500ms \
                  -count=10 \
                  -cpu=1 \
                  -exec="$PWD/lib/wasm/go_js_wasm_exec" \
                  ./src/encoding/hex | tee "$output"
            else
              env \
                GO111MODULE=off \
                GOEXPERIMENT="$experiment" \
                GOOS="${{ matrix.goos }}" \
                GOARCH="${{ matrix.goarch }}" \
                ./bin/go test \
                  -run='^$' \
                  -bench='^(BenchmarkEncode|BenchmarkDecode)$' \
                  -benchtime=500ms \
                  -count=10 \
                  -cpu=1 \
                  ./src/encoding/hex | tee "$output"
            fi
          done

          (
            cd "$raw_dir"
            "$(go env GOPATH)/bin/benchstat" \
              -filter '.name:/^(Encode|Decode)$/' \
              nosimd.txt simd.txt
          ) | tee "benchmark-results/${{ matrix.target }}-benchstat.txt"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hex-simd-${{ matrix.target }}-benchstat
          path: benchmark-results/${{ matrix.target }}-benchstat.txt
